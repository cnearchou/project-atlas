# Runs the test suite on every push and pull request (Spec §11, "Test before trusting").
# Before the first push to GitHub, this file is moved to .github/workflows/tests.yml
# (GitHub only runs workflows from that folder).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q -m "not slow"
      - name: End-to-end demo on synthetic data
        run: pytest -q -m slow
