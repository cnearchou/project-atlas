# Project Atlas: package definition.
# The core of the package depends only on NumPy, pandas, SciPy and scikit-learn, so that the
# research pipeline and the test suite run on a basic Python installation. Heavier libraries are
# grouped into optional extras and are imported lazily by the modules that need them; each of those
# modules falls back to a pure NumPy/SciPy implementation when the library is missing.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.1.0"
description = "A multi-layer quantitative equity forecasting and risk system (research code)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Constantinos" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Storage: Parquet files queried with DuckDB (Specification, Section 0.1).
storage = ["pyarrow>=14", "duckdb>=1.0"]
# Econometrics and time-series models (Sections 2, 6, 8, 9).
stats = ["statsmodels>=0.14", "linearmodels>=6.0", "arch>=6.3", "hmmlearn>=0.3"]
# Machine learning and explanations (Section 7).
ml = ["lightgbm>=4.0", "shap>=0.44"]
# Portfolio optimisation (Section 8.6).
optim = ["cvxpy>=1.4"]
# Natural language processing (Sections 3 and 6.2).
nlp = ["transformers>=4.40", "torch>=2.2", "sentence-transformers>=2.7", "datasketch>=1.6"]
# Bayesian hierarchical models (Section 6.4).
bayes = ["pymc>=5.10"]
# Data vendors and broker (Part 2 of the Technical Reference).
data = ["wrds>=3.2", "fredapi>=0.5", "edgartools>=2.0", "ib_async>=1.0", "python-dotenv>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["project-atlas[storage,stats,ml,optim,nlp,bayes,data,dev]"]

[project.scripts]
atlas = "atlas.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end demo run (about a minute); skip with -m \"not slow\""]

[tool.ruff]
line-length = 110
